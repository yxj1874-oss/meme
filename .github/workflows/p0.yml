# P0 gate. Every step runs inside the reference substrate (ci/Dockerfile via ci/run-in-ref.sh), the
# same image used locally, so "local and CI produce identical PNGs" is checked by the golden hash
# comparison itself (golden verify --require-hashes, MT4).
name: p0

on:
  push:
  pull_request:

jobs:
  p0:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit is the wall-time baseline of the perf gate (MT3).
          fetch-depth: 2

      - name: Install dependencies
        run: ci/run-in-ref.sh npm ci --no-fund --no-audit

      - name: Parent commit as the perf A/B base
        run: |
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            git worktree add --detach out/perf-base HEAD~1
          else
            echo "no parent commit: the wall-time A/B will be skipped"
          fi

      - name: Lint, types, unit tests, goldens, determinism, perf
        run: ci/run-in-ref.sh npm run ci

      - name: Mutation suite (MT2)
        run: ci/run-in-ref.sh npm run mutants

      - name: Minimal reproducing scenes for failing goldens
        if: failure()
        run: ci/run-in-ref.sh node src/cli.ts reduce --all-failing

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: p0-failure-artifacts
          path: |
            out/golden
            out/reduce
            out/determinism
            out/mutants/report.json
          if-no-files-found: ignore
